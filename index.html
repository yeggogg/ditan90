    // 原料采购卡片（支持自定义数量与一键补齐缺口 V2.6 P0 #3）
    leftCol += `<div class="card">
      <div class="card-head">
        <span class="card-title">🥬 今日原料采购（买入锁定成本）</span>
        ${disc > 0 ? `<span class="tag tag-mint">规模采购 ${Math.round((1 - disc) * 100)}折</span>` : `<span class="tag tag-gray">4车起享折扣</span>`}
      </div>`;

    unlockedStalls.forEach(stId => {
      const st = STALL_TYPES[stId];
      const stock = getStockTotal(stId);
      const unitP = Number((st.unitCost * (1 - disc)).toFixed(2));
      const planTotal = state.carts.filter(c => c.stallType === stId && c.downDays <= 0).reduce((a, c) => a + Math.min(c.prepQty, getEffectiveCartCap(c)), 0);
      const gap = totalGapByStall[stId] || 0;
      leftCol += `<div style="padding:6px 0;border-bottom:1px dotted var(--line);">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;">
          <div>
            <strong>${st.icon} ${st.name}原料</strong>
            <div class="small-note">现价 ¥${unitP}/份 · 现有 ${stock}份 · 计划 ${planTotal}份${gap > 0 ? ` · <span class="warn-badge">缺 ${gap}份</span>` : ''}</div>
          </div>
          <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">
            ${gap > 0 ? `<button class="btn btn-sm btn-yellow" data-buy="${stId}" data-qty="${gap}">补齐${gap}</button>` : ''}
            <button class="btn btn-sm" data-buy="${stId}" data-qty="50">+50</button>
            <input type="number" min="1" max="2000" value="20" class="input-num" id="customQty_${stId}" style="width:56px;">
            <button class="btn btn-sm btn-mint" data-buy-custom="${stId}">买</button>
          </div>
        </div>
      </div>`;
    });
    Object.keys(STALL_TYPES).filter(id => !isStallUnlocked(id)).forEach(stId => {
      const stock = getStockTotal(stId);
      if (stock > 0) leftCol += `<div class="row-line"><span class="small-note">${STALL_TYPES[stId].name}：${stock}份（历史库存/当前未开放）</span></div>`;
    });
    leftCol += `<div class="small-note" style="margin-top:6px;">原料只在采购时扣一次现金，日结不重复扣料；保质期2–3天。</div></div>`;

    // 今日批量订单
    if (state.todayOrder) {
      const o = state.todayOrder;
      const totalAllocForOrder = state.carts.filter(c => c.stallType === o.stallType && c.downDays <= 0).reduce((a, c) => a + (alloc[c.id] || 0), 0);
      const canSupply = totalAllocForOrder >= o.qty;
      leftCol += `<div class="card">
        <div class="card-head">
          <span class="card-title">📦 ${o.kind}</span>
          <span class="tag tag-yellow">¥${o.amount.toLocaleString()}</span>
        </div>
        <div style="font-size:12.5px;margin-bottom:8px;">
          需求 <strong>${STALL_TYPES[o.stallType].name} ${o.qty}份</strong>（单价 ¥${o.unitPrice}），违约赔付 ¥${o.penalty}。<br>
          已分配该品类库存：<strong>${totalAllocForOrder}份</strong> — ${canSupply ? '<span class="ok-badge">库存充足可接单</span>' : '<span class="warn-badge">库存不足，需先补货</span>'}
        </div>
        <button class="btn btn-sm ${state.orderAccepted ? 'btn-mint' : ''}" id="btnToggleOrder" ${!canSupply && !state.orderAccepted ? 'disabled' : ''}>
          ${state.orderAccepted ? '✓ 已承接（点击取消）' : '承接此订单'}
        </button>
      </div>`;
    }

    // 右栏：各车备料与定价（多车支持折叠卡片 + 一键沿用昨日/批量设置 V2.6 P3 #18）
    rightCol += `<div class="card">
      <div class="card-head">
        <span class="card-title">🔥 各车备料与手写价牌</span>
        <div style="display:flex;gap:4px;">
          <button class="btn btn-sm" id="btnCopyPrev">沿用昨日</button>
          <button class="btn btn-sm btn-yellow" id="btnBatchAuto">批量推荐</button>
        </div>
      </div>`;

    const useAccordion = state.carts.length >= 3;
    state.carts.forEach(c => {
      const loc = LOCATIONS[c.location];
      const cap = getEffectiveCartCap(c);
      const maxP = getMaxPriceForLocation(c.location);
      const got = alloc[c.id] || 0;
      const gap = shortage[c.id] || 0;
      const isOpen = !useAccordion || ui.expandedCartId === c.id;

      if (c.downDays > 0) {
        rightCol += `<div class="row-line"><span>${escHtml(c.name)}（改装停业中，剩余${c.downDays}天）</span><span class="tag tag-gray">停业</span></div>`;
        return;
      }

      const controlsHtml = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <div class="stepper">
            <span class="small-note" style="min-width:auto;">计划备料</span>
            <button data-prep-dec="${escHtml(c.id)}">-</button>
            <span>${c.prepQty}</span>
            <button data-prep-inc="${escHtml(c.id)}">+</button>
          </div>
          <div class="stepper">
            <span class="small-note" style="min-width:auto;">售价¥</span>
            <button data-price-dec="${escHtml(c.id)}">-</button>
            <span>${c.price}</span>
            <button data-price-inc="${escHtml(c.id)}">+</button>
          </div>
        </div>
        <div class="small-note" style="margin-top:5px;">
          已分配库存 <strong>${got}/${Math.min(c.prepQty, cap)}份</strong>（上限${cap}）· 心理价 ¥${loc.psychPrice}（最高 ¥${maxP}）
          ${gap > 0 ? `<br><span class="warn-badge">⚠ 备料计划超出可分配库存 ${gap} 份，请补货或调低计划！</span>` : ''}
          ${c.price >= maxP ? `<br><span class="warn-badge">已达该地点最高标价上限</span>` : ''}
        </div>
        ${(() => {
          const fb = getPriceFeedback(c, state);
          return `<div class="price-meter">
            <span class="${fb.cls}">${fb.badge}</span>
            <span>预估售 <strong>${fb.estSold}份</strong>（需求${fb.estD}）· 毛利约 <strong>¥${fb.estGross.toLocaleString()}</strong></span>
          </div>`;
        })()}`;

      if (useAccordion) {
        rightCol += `<div class="cart-acc">
          <div class="cart-acc-head" data-toggle-cart="${escHtml(c.id)}">
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="illus-wrap">${SVG.cartIcon(c.stallType)}</span>
              <div>
                <strong>${escHtml(c.name)} · ${STALL_TYPES[c.stallType].name}</strong>
                <div class="small-note">📍${loc.name} · 分配${got}份 · ¥${c.price} ${gap > 0 ? '<span class="warn-badge">缺料</span>' : ''}</div>
              </div>
            </div>
            <span class="small-note">${isOpen ? '▲' : '▼'}</span>
          </div>
          ${isOpen ? `<div class="cart-acc-body">${controlsHtml}</div>` : ''}
        </div>`;
      } else {
        rightCol += `<div style="padding:7px 0;border-bottom:1px dashed var(--line);">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
            <span class="illus-wrap">${SVG.cartIcon(c.stallType)}</span>
            <div>
              <strong>${escHtml(c.name)} · ${STALL_TYPES[c.stallType].name}</strong>
              <div class="small-note">📍${loc.name}（心理价 ¥${loc.psychPrice}）· 熟客 ${c.regulars}</div>
            </div>
          </div>
          ${controlsHtml}
        </div>`;
      }
    });
    rightCol += `</div>`;

    const allDown = state.carts.every(c => c.downDays > 0);
    const fixedPreview = getDailyFixedCosts(state);
    const actionBtns = `
      <div class="cost-preview-bar">
        <span>💰 今日出摊预计固定开支（若不出摊免摊位费 ¥${fixedPreview.locFees}，仅付 ¥${(fixedPreview.total - fixedPreview.locFees).toLocaleString()}）</span>
        <strong>¥${(allDown ? (fixedPreview.total - fixedPreview.locFees) : fixedPreview.total).toLocaleString()}</strong>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        ${!allDown ? `<button class="btn btn-primary" style="flex:2;min-height:42px;font-size:14px;" id="btnGoSell">装车完毕，前往出摊 →</button>` : ''}
        <button class="btn ${allDown ? 'btn-primary' : 'btn-ghost'}" style="flex:1;min-height:42px;" id="btnSkipToday">${allDown ? '全车停业中，直接进入日结 →' : '今天不出摊'}</button>
      </div>`;

    return `<div class="desktop-cols"><div>${leftCol}</div><div>${rightCol}${actionBtns}</div></div>`;
  }

  function renderStepSell() {
    const activeCount = state.carts.filter(c => c.downDays <= 0).length;
    let html = `<div class="card">
      <div class="card-head">
        <span class="card-title">🏮 街头出摊实况</span>
        <span class="tag tag-mint">${activeCount} 辆车待命</span>
      </div>
      <div class="canvas-wrap" id="sellCanvasWrap" style="cursor:pointer;" title="营业中点击画面可趣味吆喝，增添街头烟火气">
        <canvas id="sellCanvas"></canvas>
        <div class="canvas-hud">
          <span class="hud-chip" id="hudTime">${ui.selling ? '营业中...' : (state.bossFatigue >= 100 ? '老板过劳强制歇业' : '准备就绪')}</span>
          <span class="hud-chip" id="hudRev">营收 ¥${ui.liveRevSoFar.toLocaleString()}</span>
        </div>
      </div>
      <div class="sell-progress-bar"><div class="sell-progress-fill" id="sellProgFill" style="width:${Math.round(ui.sellProgress * 100)}%"></div></div>`;

    if (!ui.selling && state.dayPhase !== 'settle') {
      const isOverworked = state.bossFatigue >= 100;
      html += isOverworked
        ? `<div class="warn-banner">😵 <strong>老板疲劳已达 100（过劳极限）</strong>，今日无法点火开摊，须进入强制歇业休养（休养费 ¥180，疲劳恢复 45 点），或先点顶栏“歇一会”缓解疲劳。</div>`
        : `<div class="small-note" style="margin-bottom:8px;">营业中点击街景画面可趣味吆喝（纯氛围互动），随时可点顶栏“歇一会”暂停。</div>`;
      html += `<div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" id="btnBackPrep">← 调整备料</button>
        <button class="btn btn-primary" style="flex:1;" id="btnStartSell" ${isOverworked ? 'disabled' : ''}>${isOverworked ? '😵 过劳达100 · 无法开摊' : '🔥 点火开摊！'}</button>
        <button class="btn ${isOverworked ? 'btn-yellow' : 'btn-ghost'}" id="btnSkipFromSell">${isOverworked ? '进入过劳歇业日结 →' : '今天不出摊'}</button>
      </div>`;
    } else if (ui.selling) {
      html += `<div style="display:flex;gap:8px;">
        <button class="btn btn-yellow" id="btnSpeedSell">${ui.sellSpeed === 1 ? '⚡ 2.5倍速' : '🐢 正常速'}</button>
        <button class="btn btn-mint" style="flex:1;" id="btnFinishNow">快速收摊结算 →</button>
      </div>`;
    } else {
      html += `<button class="btn btn-primary btn-block" id="btnGoSettle">查看今日账本 →</button>`;
    }
    html += `</div>`;
    return html;
  }

  function renderStepSettle() {
    const r = state.history[state.history.length - 1];
    if (!r || r.day !== state.day) {
      return `<div class="card"><div class="small-note">今日尚未收摊，请先完成出摊或选择休业结算。</div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-primary" style="flex:1;" id="btnGoSellFromEmpty">去出摊营业</button>
        <button class="btn" id="btnSkipToday">今天不出摊</button>
      </div></div>`;
    }

    const adv = getExpansionAdvice(state);
    let topBanner = '';
    if (adv.worthBuying) {
      topBanner = `<div class="advice-banner">
        <span>💡 经营稳健，满足添置新车条件！</span>
        <button class="btn btn-sm btn-yellow" id="btnJumpFleet">去看看</button>
      </div>`;
    }

    const remainTargetSettle = Math.max(0, state.targetFund - state.treatmentFund);
    let sprintBanner = '';
    if (state.day >= 85 && remainTargetSettle > 0) {
      sprintBanner = `<div class="advice-banner" style="border-color:var(--red);background:#fff1ed;">
        <span>${state.day >= TOTAL_DAYS
          ? `🏁 <strong>第90天最后冲刺：</strong>距离目标还差 <strong>¥${remainTargetSettle.toLocaleString()}</strong>，最后一天可把现金全部转入治疗账户！`
          : `🔥 <strong>终局冲刺（剩余 ${TOTAL_DAYS - state.day} 天）：</strong>距离目标还差 <strong>¥${remainTargetSettle.toLocaleString()}</strong>，请抓紧转入治疗账户！`}</span>
        <button class="btn btn-sm btn-primary" id="btnSprintFund">去转入</button>
      </div>`;
    }
    const forcedRestBanner = r.forcedRest
      ? `<div class="warn-banner">🏥 <strong>今日因过劳强制歇业：</strong>老板疲劳达到 100 触发强制休养（休养费 ¥${r.forcedRestCost}，疲劳恢复 45 点），今日全队停业无营收，仅产生固定与日常开支。</div>`
      : (state.bossFatigue >= 80
        ? `<div class="warn-banner">⚠ <strong>高度疲劳预警（${state.bossFatigue}/100）：</strong>老板已进入高度疲劳（出餐 -22%），继续硬扛达到 100 将触发强制停业休养！建议明日先点“歇一会”或招聘员工分担。</div>`
        : '');
    let leftCol = `${sprintBanner}${topBanner}${forcedRestBanner}<div class="card">
      <div class="card-head">
        <span class="card-title">📒 第${r.day}天 ${r.forcedRest ? '过劳强制歇业总账' : (r.skipped ? '休业总账' : '收摊总账')}</span>
        <span class="tag ${r.totalNetProfit >= 0 ? 'tag-mint' : 'tag-red'}">净利 ${r.totalNetProfit >= 0 ? '+' : ''}¥${r.totalNetProfit.toLocaleString()}</span>
      </div>
      <div class="grid-3" style="margin-bottom:8px;">
        <div class="stat-box"><div class="stat-label">今日总收入</div><div class="stat-val">¥${r.totalRev.toLocaleString()}</div></div>
        <div class="stat-box"><div class="stat-label">账面总成本</div><div class="stat-val">¥${r.totalCost.toLocaleString()}</div></div>
        <div class="stat-box"><div class="stat-label">现金收支净额</div><div class="stat-val ${r.cashDeltaAtSettle >= 0 ? 'pos' : 'neg'}">${r.cashDeltaAtSettle >= 0 ? '+' : ''}¥${r.cashDeltaAtSettle.toLocaleString()}</div></div>
      </div>
      <div class="row-line"><span>已售原料成本（FIFO进价，采购已付现）</span><span>¥${r.totalCogsCost.toLocaleString()}</span></div>
      <div class="row-line"><span>未售损耗 / 过期报废（账面成本）</span><span>¥${r.totalSpoilageCost} / ¥${r.expiredCost}</span></div>
      <div class="row-line"><span>摊位费、车维与包装耗材（¥0.6/份，现付）</span><span>¥${r.totalDirectCashCost.toLocaleString()}（含包装 ¥${r.totalPackagingCost || 0}）</span></div>
      <div class="row-line"><span>员工工资 / 备料中心维护</span><span>¥${r.wages} / ¥${r.centerMaint}</span></div>
      <div class="row-line"><span>车队管理费（${r.cartCount}车）</span><span>¥${r.mgmtFee}</span></div>
      ${r.sixthFee > 0 ? `<div class="row-line"><span>第六车额外保障费（单列）</span><span class="warn-badge">¥${r.sixthFee}</span></div>` : ''}
      ${r.overtimeCost > 0 ? `<div class="row-line"><span>超负荷加班/应急代工费</span><span class="warn-badge">¥${r.overtimeCost}</span></div>` : ''}
      ${r.orderPenalty > 0 ? `<div class="row-line"><span>订单违约赔付</span><span class="warn-badge">¥${r.orderPenalty}</span></div>` : ''}
      ${r.forcedRestCost > 0 ? `<div class="row-line"><span>过劳100强制休养费</span><span class="warn-badge">¥${r.forcedRestCost}</span></div>` : ''}
      <div class="row-line"><span>工时分工（员工 / 老板）</span><span>${r.staffUsedPrep}h / ${r.bossPrepHours}h</span></div>
    </div>`;

    // 右栏：每车独立分账 + 公共费用行严格对账 (V2.6 P1 #6 & P2 #10)
    let rightCol = `<div class="card">
      <div class="card-head"><span class="card-title">🛒 每车复盘（售价 vs 销量 vs 利润）</span><span class="small-note">严苛对账</span></div>`;
    r.cartResults.forEach(cr => {
      if (cr.down) {
        rightCol += `<div class="row-line"><span>${escHtml(cr.name)}</span><span class="tag tag-gray">停业/休业（净利 ¥${cr.netProfit}）</span></div>`;
        return;
      }
      const advice = [];
      if (cr.noStock) advice.push('无库存未出摊');
      else {
        if (cr.sold < cr.prep * 0.65) advice.push('备料偏多或售价偏高');
        if (cr.demand > cr.prep * 1.15) advice.push('供不应求，可加备料或小幅提价');
        if (cr.price <= LOCATIONS[cr.location].psychPrice && cr.netProfit < 200) advice.push('薄利卖光，建议适当提价至1.15倍左右');
      }
      rightCol += `<div style="padding:6px 0;border-bottom:1px dotted var(--line);font-size:12.5px;">
        <div style="display:flex;justify-content:space-between;">
          <strong>${escHtml(cr.name)}（${STALL_TYPES[cr.stallType].name} · ${LOCATIONS[cr.location].name}）</strong>
          <strong class="${cr.netProfit >= 0 ? 'ok-badge' : 'warn-badge'}">净利 ${cr.netProfit >= 0 ? '+' : ''}¥${cr.netProfit}</strong>
        </div>
        <div class="small-note">售价 ¥${cr.price} · 售出 ${cr.sold + cr.orderSold}/${cr.prep}份（需求${cr.demand}）· 贡献 ¥${cr.contribProfit} · 分摊 ¥${cr.sharedCost + cr.fixedCost}</div>
        ${advice.length ? `<div class="small-note" style="color:var(--red-dark);">复盘：${advice.join('；')}</div>` : ''}
      </div>`;
    });

    // 显式“公共费用”行，让各车净利之和 + 公共净利 === 总净利一目了然！
    rightCol += `<div class="public-row">
      <div class="row-line" style="padding:2px 0;border:none;">
        <span><strong>公共费用 / 未分摊公共净利</strong>（加班、违约、过期与尾差）</span>
        <strong class="${r.unallocatedPublicNet >= 0 ? 'ok-badge' : 'warn-badge'}">${r.unallocatedPublicNet >= 0 ? '+' : ''}¥${r.unallocatedPublicNet}</strong>
      </div>
      <div class="small-note">✓ 对账校验：各车合计 ¥${r.sumCartNet} + 公共净利 ¥${r.unallocatedPublicNet} = 总净利 ¥${r.totalNetProfit}（误差 ¥${r.reconDiff.toFixed(2)}）</div>
    </div></div>`;

    rightCol += `<div style="display:flex;gap:8px;">
      <button class="btn btn-mint" id="btnQuickFund">转入治疗账户</button>
      <button class="btn btn-primary" style="flex:1;" id="btnNextDay">${state.day >= TOTAL_DAYS ? '完成第90天总结算' : `进入第${state.day + 1}天 →`}</button>
    </div>`;

    return `<div class="desktop-cols"><div>${leftCol}</div><div>${rightCol}</div></div>`;
  }

  /* ==================== 13. 动态事件绑定 ==================== */
  function buyMaterial(stId, qty) {
    qty = Math.floor(Number(qty));
    if (!Number.isFinite(qty) || qty < 1 || qty > 2000) { showToast('单次采购数量须在 1–2000 份之间', true); SFX.warn(); return; }
    const disc = getBulkDiscount(state.carts.length);
    const lockedUnitCost = Number((STALL_TYPES[stId].unitCost * (1 - disc)).toFixed(2));
    const cost = Math.round(qty * lockedUnitCost);
    if (state.cash < cost) { showToast(`现金不足，采购 ${qty} 份需 ¥${cost.toLocaleString()}`, true); SFX.warn(); return; }
    state.cash -= cost;
    state.inventory[stId].push({ qty, unitCost: lockedUnitCost, buyDay: state.day, shelfLife: STALL_TYPES[stId].shelfLife });
    SFX.coin(); saveGame(); render();
  }

  function bindDynamicEvents() {
    document.querySelectorAll('[data-buy]').forEach(btn => {
      btn.addEventListener('click', () => buyMaterial(btn.dataset.buy, btn.dataset.qty));
    });
    document.querySelectorAll('[data-buy-custom]').forEach(btn => {
      btn.addEventListener('click', () => {
        const stId = btn.dataset.buyCustom;
        const inp = document.getElementById(`customQty_${stId}`);
        buyMaterial(stId, inp ? inp.value : 0);
      });
    });

    // 折叠卡片切换
    document.querySelectorAll('[data-toggle-cart]').forEach(el => {
      el.addEventListener('click', () => {
        const cid = el.dataset.toggleCart;
        ui.expandedCartId = (ui.expandedCartId === cid) ? '' : cid;
        SFX.click(); render();
      });
    });

    // 一键沿用昨日设置 / 批量推荐 (V2.7 P1 #4 & P2 #13)
    const btnCopyPrev = document.getElementById('btnCopyPrev');
    if (btnCopyPrev) btnCopyPrev.addEventListener('click', () => {
      state.carts.forEach(c => {
        if (typeof c.prevPrepQty === 'number' && Number.isFinite(c.prevPrepQty)) {
          c.prepQty = Math.max(0, Math.min(getEffectiveCartCap(c), c.prevPrepQty));
        }
        if (typeof c.prevPrice === 'number' && Number.isFinite(c.prevPrice)) {
          c.price = Math.max(8, Math.min(getMaxPriceForLocation(c.location), c.prevPrice));
        }
      });
      SFX.click(); saveGame(); render();
      showToast('已一键沿用昨日各车备料与定价');
    });

    const btnBatchAuto = document.getElementById('btnBatchAuto');
    if (btnBatchAuto) btnBatchAuto.addEventListener('click', () => {
      state.carts.forEach(c => {
        if (c.downDays > 0) return;
        const loc = LOCATIONS[c.location];
        c.price = Math.min(getMaxPriceForLocation(c.location), Math.round(loc.psychPrice * 1.18));
        const estD = estimateCartDemand(c, state);
        const nextQty = Math.min(getEffectiveCartCap(c, state), Math.round(estD * 1.12));
        if (Number.isFinite(nextQty) && nextQty >= 0) c.prepQty = nextQty;
      });
      SFX.click(); saveGame(); render();
      showToast('已按甜区定价与 1.12 倍预估需求批量推荐备料');
    });

    // 备料与调价
    document.querySelectorAll('[data-prep-dec]').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = state.carts.find(x => x.id === btn.dataset.prepDec);
        if (c) { c.prepQty = Math.max(0, c.prepQty - 10); SFX.click(); saveGame(); render(); }
      });
    });
    document.querySelectorAll('[data-prep-inc]').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = state.carts.find(x => x.id === btn.dataset.prepInc);
        if (c) { c.prepQty = Math.min(getEffectiveCartCap(c), c.prepQty + 10); SFX.click(); saveGame(); render(); }
      });
    });
    document.querySelectorAll('[data-price-dec]').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = state.carts.find(x => x.id === btn.dataset.priceDec);
        if (c) { c.price = Math.max(8, c.price - 1); SFX.click(); saveGame(); render(); }
      });
    });
    document.querySelectorAll('[data-price-inc]').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = state.carts.find(x => x.id === btn.dataset.priceInc);
        if (c) {
          const maxP = getMaxPriceForLocation(c.location);
          if (c.price >= maxP) { showToast(`已达${LOCATIONS[c.location].name}最高标价上限（¥${maxP}）`, false, 1500); return; }
          c.price = Math.min(maxP, c.price + 1); SFX.click(); saveGame(); render();
        }
      });

    const btnOrd = document.getElementById('btnToggleOrder');
    if (btnOrd) btnOrd.addEventListener('click', () => { state.orderAccepted = !state.orderAccepted; SFX.click(); saveGame(); render(); });

    const btnGoSell = document.getElementById('btnGoSell');

    if (btnGoSettle) btnGoSettle.addEventListener('click', () => { ui.step = 'settle'; SFX.click(); render(); });
    const btnGoSellEmpty = document.getElementById('btnGoSellFromEmpty');
    if (btnGoSellEmpty) btnGoSellEmpty.addEventListener('click', () => { ui.step = 'sell'; SFX.click(); render(); });
    const btnNextDay = document.getElementById('btnNextDay');
    if (btnNextDay) btnNextDay.addEventListener('click', () => { SFX.click(); advanceToNextDay(); });
    const btnQuickFund = document.getElementById('btnQuickFund');
    if (btnQuickFund) btnQuickFund.addEventListener('click', () => { ui.tab = 'fund'; SFX.click(); render(); });
    const btnJumpFleet = document.getElementById('btnJumpFleet');
    if (btnJumpFleet) btnJumpFleet.addEventListener('click', () => { ui.tab = 'fleet'; SFX.click(); render(); });
    const btnSprintFund = document.getElementById('btnSprintFund');
    if (btnSprintFund) btnSprintFund.addEventListener('click', () => { ui.tab = 'fund'; SFX.click(); render(); });
    const btnBarJumpFund = document.getElementById('btnBarJumpFund');
    if (btnBarJumpFund) btnBarJumpFund.addEventListener('click', () => { ui.tab = 'fund'; SFX.click(); render(); });
    const btnHideGuide = document.getElementById('btnHideGuide');
    if (btnHideGuide) btnHideGuide.addEventListener('click', () => {
      ui.guideDismissed = true;
      settings.guideDismissed = true;
      saveSettings();
      SFX.click(); render();
    });
    const btnOneTapReady = document.getElementById('btnOneTapReady');
    if (btnOneTapReady) btnOneTapReady.addEventListener('click', () => {
      state.carts.forEach(c => {
        if (c.downDays > 0) return;
        const loc = LOCATIONS[c.location];
        c.price = Math.min(getMaxPriceForLocation(c.location), Math.round(loc.psychPrice * 1.18));
        const nextQty = Math.min(getEffectiveCartCap(c, state), Math.round(estimateCartDemand(c, state) * 1.12));
        if (Number.isFinite(nextQty) && nextQty >= 0) c.prepQty = nextQty;
      });
      const { totalGapByStall } = allocateInventoryToCarts(state);
      let boughtAny = false, hitCap = false, shortCash = false;
      Object.keys(totalGapByStall).forEach(stId => {
        const g = totalGapByStall[stId];
        if (g > 0) {
          if (g > 2000) hitCap = true;
          const disc = getBulkDiscount(state.carts.length);
          const u = Number((STALL_TYPES[stId].unitCost * (1 - disc)).toFixed(2));
          const maxAfford = Math.floor(state.cash / u);
          const targetBuy = Math.min(g, 2000);
          if (maxAfford < targetBuy) shortCash = true;
          const buyQty = Math.min(targetBuy, maxAfford);
          if (buyQty > 0) {
            state.cash -= Math.round(buyQty * u);
            state.inventory[stId].push({ qty: buyQty, unitCost: u, buyDay: state.day, shelfLife: STALL_TYPES[stId].shelfLife });
            boughtAny = true;
          }
        }
      });
      SFX.coin(); saveGame(); render();
      if (hitCap || shortCash) {
        showToast(`已定好价并尽力采购，但因${hitCap ? '单次2000上限' : ''}${hitCap && shortCash ? '与' : ''}${shortCash ? '现金不足' : ''}仍有缺口！`, true, 2400);
      } else {
        showToast(boughtAny ? '已按甜区定好价并补齐原料，可直接前往出摊！' : '已按甜区定好价，当前原料已充足！', false, 2000);
      }
    });
    const sellWrap = document.getElementById('sellCanvasWrap');
    if (sellWrap) sellWrap.addEventListener('click', () => {
      if (!ui.selling || ui.paused) return;
      const lines = ['刚出炉的烤串嘞！', '走过路过别错过！', '现做现卖，真材实料！', '老街坊优惠，快来尝尝！'];
      ui.liveShouts.push({ x: 90 + Math.random() * 180, y: 78 + Math.random() * 25, txt: lines[Math.floor(Math.random() * lines.length)], life: 1.0 });
      SFX.click();
    });

    // 今天不出摊，直接结算兜底按钮 (V2.6 P0 #3)
    ['btnSkipToday', 'btnSkipFromSell'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('click', () => {
        openModal('🛑 今天不出摊，直接结算？',
          '<p style="font-size:13px;">今天不出摊将不产生营收，但仍需支付固定管理费与员工日薪，同时老板疲劳降低 30 点。确定直接结算吗？</p>',
          [
            { text: '再想想', onClick: closeModal },
            { text: '确认休业结算', cls: 'btn-primary', onClick: () => { closeModal(); finishLiveSelling(true); } }
          ]);
      });
    });

    // 搬点弹窗（显示当前地点且默认“请选择”防止误点 V2.6 P3 #20）
    document.querySelectorAll('[data-move-cart]').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = state.carts.find(x => x.id === btn.dataset.moveCart);
        if (!c) return;
        const curLoc = LOCATIONS[c.location];
        const opts = `<option value="">-- 请选择新地点 --</option>` + Object.values(LOCATIONS).filter(l => l.id !== c.location).map(l =>
          `<option value="${l.id}">${l.name}（心理价 ¥${l.psychPrice} · 日摊费 ¥${l.dailyFee} · 客流基数${l.baseTraffic}）</option>`).join('');
        openModal(`📍 ${escHtml(c.name)} 搬迁地点`,
          `<p style="font-size:12.5px;">当前地点：<strong>${curLoc.name}</strong>（熟客 ${c.regulars}）<br>搬迁费用 <strong>¥${ECON.moveFee}</strong>，搬迁后冷却 <strong>${ECON.moveCooldown}天</strong> 并损失约一半熟客。</p>
           <select class="retro-select" id="selMoveLoc" style="width:100%;">${opts}</select>`,
          [
            { text: '取消', onClick: closeModal },
            { text: `确认搬点 (-¥${ECON.moveFee})`, cls: 'btn-primary', onClick: () => {
              const nl = document.getElementById('selMoveLoc').value;
              if (!nl) { showToast('请先选择目标新地点', true); return; }
              if (state.cash < ECON.moveFee) { showToast('现金不足支付搬迁费', true); return; }
              state.cash -= ECON.moveFee;
              c.location = nl;
              c.price = Math.min(getMaxPriceForLocation(nl), Math.round(LOCATIONS[nl].psychPrice * 1.15));
              c.moveCooldown = ECON.moveCooldown;
              c.regulars = Math.floor(c.regulars * 0.5);
              closeModal(); SFX.coin(); saveGame(); render();
              showToast(`${c.name}已迁至${LOCATIONS[nl].name}`);
            }}
          ]);
      });
    });

    // 转型弹窗（显示当前摊型 + 保底提示 V2.6 P0 #3 & P3 #20）
    document.querySelectorAll('[data-transform-cart]').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = state.carts.find(x => x.id === btn.dataset.transformCart);
        if (!c) return;
        const otherActive = state.carts.filter(x => x.id !== c.id && x.downDays <= 0).length;
        if (otherActive === 0) {
          showToast('转型须至少保留 1 辆在营车辆（单车模式不可转型唯一摊车）！', true, 2200);
          SFX.warn();
          return;
        }
        const opts = `<option value="">-- 请选择目标摊型 --</option>` + Object.values(STALL_TYPES).filter(t => isStallUnlocked(t.id) && t.id !== c.stallType).map(t =>
          `<option value="${t.id}">${t.icon} ${t.name}（基准成本 ¥${t.unitCost}）</option>`).join('');
        openModal(`🔧 ${escHtml(c.name)} 摊位转型`,
          `<p style="font-size:12.5px;">当前摊型：<strong>${STALL_TYPES[c.stallType].icon} ${STALL_TYPES[c.stallType].name}</strong><br>
           改装费用：<strong>¥${ECON.transformCost}</strong> · 预计停业：<strong>${ECON.transformDownDays} 天</strong> · 冷却：<strong>${ECON.transformCooldown} 天</strong></p>
           ${otherActive === 0 ? `<div class="warn-banner">注意：这是你当前唯一营业中的摊车，改装后今日将全队停业，可在经营页点“直接进入日结”推进下一天。</div>` : ''}
           <select class="retro-select" id="selTransType" style="width:100%;">${opts}</select>`,
          [
            { text: '取消', onClick: closeModal },
            { text: `确认改装 (-¥${ECON.transformCost})`, cls: 'btn-primary', onClick: () => {
              const nt = document.getElementById('selTransType').value;
              if (!nt) { showToast('请先选择目标摊型', true); return; }
              if (state.cash < ECON.transformCost) { showToast('现金不足支付改装费', true); return; }
              state.cash -= ECON.transformCost;
              c.stallType = nt;
              c.price = Math.min(getMaxPriceForLocation(c.location), STALL_TYPES[nt].defaultPrice);
              c.downDays = ECON.transformDownDays;
              c.transformCooldown = ECON.transformCooldown;
              closeModal(); SFX.coin(); saveGame(); render();
              showToast(`${c.name}开始改装为${STALL_TYPES[nt].name}，停业1天`);
            }}
          ]);
      });
    });

    // 买车
    document.querySelectorAll('[data-buy-veh]').forEach(btn => {
      btn.addEventListener('click', () => {
        const vId = btn.dataset.buyVeh;
        const veh = VEHICLE_TYPES[vId];
        const adv = getExpansionAdvice(state, vId);
        if (adv.isFull) return;
        const newIdx = state.carts.length + 1;
        openModal(`🛒 确认购买 ${veh.name}`,
          `<p style="font-size:12.5px;">价格：<strong>¥${veh.price.toLocaleString()}</strong>（基础载量 ${veh.cap}份，日维护 ¥${veh.maint}）</p>
           ${newIdx === 6 ? `<p class="warn-badge" style="font-size:12.5px;">注意：第6辆车将额外产生每日 ¥${ECON.sixthCartGuarantee} 保障费（单独列示）。</p>` : ''}
           <p style="font-size:12.5px;">评估：${adv.worthBuying ? '<span class="ok-badge">✓ 买得起且值得买</span>' : `<span class="warn-badge">⚠ 买得起但暂不建议（${adv.reasons.join('；')}）</span>`}</p>`,
          [
            { text: '再想想', onClick: closeModal },
            { text: '确认购车', cls: 'btn-primary', onClick: () => {
              if (state.cash < veh.price) { showToast('现金不足', true); return; }
              state.cash -= veh.price;
              const locs = Object.keys(LOCATIONS);
              const nl = locs[(newIdx - 1) % locs.length];
              state.carts.push({
                id: `cart_${Date.now()}`, name: `${newIdx}号摊车`,
                vehicleType: vId, stallType: 'bbq', location: nl,
                price: Math.round(LOCATIONS[nl].psychPrice * 1.15),
                prepQty: Math.min(140, veh.cap),
                prevPrice: Math.round(LOCATIONS[nl].psychPrice * 1.15),
                prevPrepQty: Math.min(140, veh.cap),
                moveCooldown: 0, transformCooldown: 0, downDays: 0, regulars: 0, cumNetProfit: 0, lastReport: null
              });
              closeModal(); SFX.bell(); saveGame(); render();
              showToast(`喜提${newIdx}号${veh.name}！`);
            }}
          ]);
      });
    });

    // 招人 / 解雇
    document.querySelectorAll('[data-hire-staff]').forEach(btn => {
      btn.addEventListener('click', () => {
        const limit = getMaxStaff(state);
        if (state.staff.length >= limit) {
          showToast(`当前车队最多雇佣 ${limit} 名员工！`, true);
          SFX.warn();
          return;
        }
        const tpl = STAFF_POOL[Number(btn.dataset.hireStaff)];
        if (!tpl) return;
        state.staff.push({ id: `st_${Date.now()}`, ...tpl });
        SFX.bell(); saveGame(); render();
        showToast(`已招聘 ${tpl.name}（日薪 ¥${tpl.wage}）`);
      });
    });
    document.querySelectorAll('[data-fire-staff]').forEach(btn => {
      btn.addEventListener('click', () => {
        const removed = state.staff.splice(Number(btn.dataset.fireStaff), 1)[0];
        SFX.click(); saveGame(); render();
        if (removed) showToast(`已解雇 ${removed.name}`);
      });
    });

    // 备料中心建设与升级
    const btnLv2 = document.getElementById('btnBuildLv2');
    if (btnLv2) btnLv2.addEventListener('click', () => {
      if (state.cash < ECON.lv2BuildCost) return;
      openModal('🏭 建设 LV2 中央备料中心',
        `<p style="font-size:12.5px;">费用 ¥${ECON.lv2BuildCost.toLocaleString()}，每日维护费 ¥${ECON.lv2Maint}，有效备料上限提升至 ${ECON.lv2Cap} 份。</p>`,
        [
          { text: '取消', onClick: closeModal },
          { text: '确认建设', cls: 'btn-primary', onClick: () => {
            if (state.cash < ECON.lv2BuildCost) return;
            state.cash -= ECON.lv2BuildCost;
            state.prepCenter.level = 2;
            state.prepCenter.builtDay = state.day;
            closeModal(); SFX.bell(); saveGame(); render();
            showToast('LV2 中央备料中心已建成！');
          }}
        ]);
    });

    const btnLv3 = document.getElementById('btnUpgradeLv3');
    if (btnLv3) btnLv3.addEventListener('click', () => {
      const lv3 = getLv3Evaluation(state);
      if (!lv3.allMet) return;
      openModal('🏭 升级 LV3 高效备料中心',
        `<p style="font-size:12.5px;">四项门槛已全部满足！升级费 ¥${ECON.lv3UpgradeCost.toLocaleString()}，每日维护 ¥${ECON.lv3Maint}，预计30天省下的钱约 ¥${lv3.predSave30.toLocaleString()}。</p>`,
        [
          { text: '取消', onClick: closeModal },
          { text: '确认升级', cls: 'btn-primary', onClick: () => {
            if (state.cash < ECON.lv3UpgradeCost) return;
            state.cash -= ECON.lv3UpgradeCost;
            state.prepCenter.level = 3;
            state.prepCenter.lv3UpgradeDay = state.day;
            state.prepCenter.lv3PredSave30 = lv3.predSave30;
            closeModal(); SFX.bell(); saveGame(); render();
            showToast('LV3 高效备料中心已投入使用！');
          }}
        ]);
    });

    // 治疗账户转账（V2.7 P2 #11：按确认弹窗实例状态一次性加锁 NB-10）
    document.querySelectorAll('[data-transfer]').forEach(btn => {
      btn.addEventListener('click', () => {
        const amt = Math.floor(Number(btn.dataset.transfer));
        if (!Number.isFinite(amt) || amt <= 0 || state.cash < amt) { showToast('可转现金不足', true); return; }
        let consumed = false;
        openModal('🏥 确认转入治疗账户',
          `<p style="font-size:13px;">确定将 <strong>¥${amt.toLocaleString()}</strong> 转入母亲治疗账户吗？转出后不可撤回。</p>`,
          [
            { text: '取消', onClick: closeModal },
            { text: '确认转入', cls: 'btn-primary', onClick: () => {
              if (consumed || ui.transferLock) return;
              consumed = true;
              ui.transferLock = true;
              try {
                if (state.cash < amt) { showToast('现金不足，无法转账', true); closeModal(); return; }
                state.cash -= amt;
                state.treatmentFund += amt;
                closeModal(); SFX.coin();
                if (state.treatmentFund >= state.targetFund && !state.finished) {
                  state.finished = true;
                  state.outcome = 'win';
                  saveGame(); render(); showEndingModal();
                } else {
                  saveGame(); render();
                  showToast(`已成功转入 ¥${amt.toLocaleString()}！`);
                }
              } finally {
                ui.transferLock = false;
              }
            }}
          ]);
      });
    });
  }

  /* ==================== 14. 设置页面（对外隐藏开发快测 V2.6 P3 #22） ==================== */

      </div>`;
    openModal('⚙️ 设置与存档管理', html, [{ text: '关闭', cls: 'btn-primary', onClick: closeModal }]);

    ['setLargeFont', 'setPaperTex', 'setIllus', 'setReduce'].forEach(id => {
      const el = document.getElementById(id);

        settings.largeFont = document.getElementById('setLargeFont').checked;
        settings.paperTex = document.getElementById('setPaperTex').checked;
        settings.showIllus = document.getElementById('setIllus').checked;
        settings.reduceMotion = document.getElementById('setReduce').checked;
        saveSettings();
      });
    });

    document.getElementById('btnExportLogs').addEventListener('click', () => {
      const summary = JSON.stringify({
        ver: DESIGN_VER, saveVer: SAVE_VERSION, day: state.day, cash: state.cash, fund: state.treatmentFund,
        auditCount: state.profitAuditLog.length, lv3Logs: state.lv3Log.length
      });
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(summary);
        else {
          const ta = document.createElement('textarea'); ta.value = summary; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy'); document.body.removeChild(ta);

        [

          { text: '继续清空', cls: 'btn-primary', onClick: () => {

              [
                { text: '我再想想', onClick: closeModal },
                { text: '确认永久清空', cls: 'btn-primary', onClick: () => {
                  StorageAdapter.remove(SAVE_KEY);
                  if (!StorageAdapter.getRaw(SAVE_KEY)) {
                    state = null;
                    closeModal();
                    showStartScreen();
                    showToast('存档已彻底清除，请重新选择难度开局');
                  }
                }}
              ]);
          }}
        ]);
    });

  /* ==================== 15. 开局页与全局导航绑定 ==================== */
  function showStartScreen(preserveDiffClick) {
    if (ui.liveAnimId) { cancelAnimationFrame(ui.liveAnimId); ui.liveAnimId = null; }
    ui.selling = false;
    setTitleChromeVisible(true);
    const mainEl = document.getElementById('mainScroll');
    if (mainEl) mainEl.innerHTML = '';
    const chkSingle = document.getElementById('chkSingleChallenge');
    if (chkSingle && !preserveDiffClick) chkSingle.checked = false;

    const list = document.getElementById('diffList');
    list.innerHTML = Object.values(DIFFICULTIES).map(d => `
      <div class="diff-card ${ui.selectedDiff === d.id ? 'selected' : ''}" data-diff="${d.id}">
        <div>
          <strong>${d.name}</strong>
          <div class="small-note">${d.desc}</div>
        </div>
        <span class="tag tag-yellow">开局 ¥${d.startCash.toLocaleString()}</span>
      </div>`).join('');
    list.querySelectorAll('.diff-card').forEach(el => {
      el.addEventListener('click', () => { ui.selectedDiff = el.dataset.diff; SFX.click(); showStartScreen(true); });
    });

    const rawSaved = StorageAdapter.get(SAVE_KEY);
    const btnCont = document.getElementById('btnContinue');
    if (rawSaved) {
      const check = validateAndRepairSave(rawSaved);
      if (check.ok && !check.state.finished) {
        btnCont.style.display = 'inline-flex';
        btnCont.textContent = `继续第${check.state.day}天`;
      } else if (!check.ok) {
        const rawStr = StorageAdapter.getRaw(SAVE_KEY) || '';
        const backedUp = StorageAdapter.set(BACKUP_KEY, rawStr);
        btnCont.style.display = 'none';
        if (backedUp) {
          StorageAdapter.remove(SAVE_KEY);
          showToast(`检测到损坏存档（${check.reason}），已备份成功并安全重置。`, true, 3200);
        } else {
          showToast(`检测到损坏存档（${check.reason}），因本地存储受限未删除原档。`, true, 3400);
        }
      } else {
        btnCont.style.display = 'none';
      }
    } else {
      btnCont.style.display = 'none';
    }
    document.getElementById('startScreen').style.display = 'flex';
  }

  function actuallyStartNewGame() {
    const single = document.getElementById('chkSingleChallenge').checked;
    state = createInitialState(ui.selectedDiff, single);
    ui.tab = 'operate';
    ui.step = 'prep';
    ui.expandedCartId = state.carts[0].id;
    document.getElementById('startScreen').style.display = 'none';
    setTitleChromeVisible(false);
    saveGame();
    render();
    showToast('欢迎推车出摊！先看定价贴士和库存再开摊吧', false, 2000);
  }

  function bindStaticEvents() {
    // V2.6 P2 #15：“新开局”覆盖已有存档前弹窗确认
    document.getElementById('btnStartNew').addEventListener('click', () => {
      SFX.click();
      const raw = StorageAdapter.get(SAVE_KEY);
      const check = raw ? validateAndRepairSave(raw) : { ok: false };
      if (check.ok && !check.state.finished) {
        openModal('⚠️ 覆盖已有存档？',
          `<p style="font-size:13px;">检测到进行中的进度（第${check.state.day}天，治疗账户 ¥${check.state.treatmentFund.toLocaleString()}）。开启新局将覆盖该存档，确定吗？</p>`,
          [
            { text: '取消', onClick: closeModal },
            { text: '确认新开局', cls: 'btn-primary', onClick: () => { closeModal(); SFX.bell(); actuallyStartNewGame(); } }
          ]);
      } else {
        SFX.bell();
        actuallyStartNewGame();
      }
    });

    document.getElementById('btnContinue').addEventListener('click', () => {
      const raw = StorageAdapter.get(SAVE_KEY);
      const check = validateAndRepairSave(raw);
      if (check.ok) {
        state = check.state;
        ui.tab = 'operate';
        ui.step = state.dayPhase === 'settle' ? 'settle' : 'prep';
        ui.expandedCartId = state.carts[0].id;
        document.getElementById('startScreen').style.display = 'none';
        setTitleChromeVisible(false);
        SFX.click();
        render();
      } else {
        showToast('存档校验失败，已为你安全清理', true);
        showStartScreen();
      }
    });

    document.getElementById('btnRest').addEventListener('click', () => {
      if (!state) return;
      SFX.click();
      if (ui.selling) {
        ui.paused = !ui.paused;
        if (!ui.paused && !ui.liveAnimId) runCanvasLoop();
        render();
        showToast(ui.paused ? '已暂停营业，歇一会再继续' : '继续红火营业！');
      } else {
        if (state.bossFatigue <= 0) { showToast('老板精力充沛，不需要歇息'); return; }
        const used = state.restUsedToday || 0;
        if (used >= ECON.restDailyLimit) {
          showToast(`今日已歇息 ${used}/${ECON.restDailyLimit} 次，达到每日上限，请明日再歇或雇员工分担！`, true, 2400);
          SFX.warn();
          return;
        }
        const costNow = ECON.restCosts[used] || 180;
        const recNow = ECON.restRecover[used] || 20;
        const leftTimes = ECON.restDailyLimit - used;
        openModal('🍵 歇一会 · 缓解疲劳',
          `<p style="font-size:13px;">当前老板疲劳度 <strong>${state.bossFatigue}/100</strong>（${getFatigueTierInfo(state.bossFatigue).label}）。<br>
           今日还可歇息 <strong>${leftTimes} 次</strong>（同日多次费用递增）。本次花 <strong>¥${costNow}</strong> 喝杯凉茶歇一会，可降低 <strong>${recNow} 点</strong>疲劳。</p>`,
          [
            { text: '先不歇', onClick: closeModal },
            { text: `歇一会 (-¥${costNow})`, cls: 'btn-mint', onClick: () => {
              if ((state.restUsedToday || 0) >= ECON.restDailyLimit) { closeModal(); return; }
              if (state.cash < costNow) { showToast(`现金不足 ¥${costNow}`, true); return; }
              state.cash -= costNow;
              state.bossFatigue = Math.max(0, state.bossFatigue - recNow);
              state.restUsedToday = (state.restUsedToday || 0) + 1;
              closeModal(); saveGame(); render();
              showToast(`喝了凉茶，疲劳度降低 ${recNow} 点（今日已用 ${state.restUsedToday}/${ECON.restDailyLimit} 次）`);
            }}
          ]);
      }
    });

    document.getElementById('btnSound').addEventListener('click', () => {
      settings.sound = !settings.sound;
      saveSettings();
      if (settings.sound) SFX.click();
    });

    document.getElementById('btnSettings').addEventListener('click', () => {
      if (!state) return;
      SFX.click();
      openSettingsModal();
    });

    document.querySelectorAll('.step-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!state) return;
        if (ui.selling && btn.dataset.step !== 'sell') {
          showToast('正在出摊营业中，请先收摊或点“歇一会”', false);
          return;
        }
        ui.tab = 'operate';
        ui.step = btn.dataset.step;
        SFX.click();
        render();
      });
    });

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!state) return;
        if (ui.selling && btn.dataset.tab !== 'operate') {
          ui.paused = true;
          showToast('已自动暂停营业，切回“今日经营”可继续');
        }
        ui.tab = btn.dataset.tab;
        SFX.click();
        render();
      });
    });

    // V2.6 P2 #16：切后台彻底停掉动画循环并保存，切回时恢复
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (ui.liveAnimId) { cancelAnimationFrame(ui.liveAnimId); ui.liveAnimId = null; }
        if (state) {
          if (ui.selling && !ui.paused) ui.paused = true;
          saveGame();
        }
      } else {
        if (ui.selling && !ui.paused && !ui.liveAnimId) runCanvasLoop();
      }
    });

    window.addEventListener('resize', () => {
      const c = document.getElementById('sellCanvas');
      if (c && ui.selling) drawStreetScene(c);
    });
  }

  window.onload = function() {
    applySettingsToDOM();
    bindStaticEvents();
    showStartScreen();
  };
})();
</script>
</body>
</html>
